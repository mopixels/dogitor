[package]
name = "dogitor"
version = "0.1.0"
edition = "2021"
default-run = "dogitor"
description = "Sound-triggered home monitor: detect loud sounds, record a video+audio clip, notify via Telegram."

[dependencies]
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
teloxide = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"] }
serde_json = "1.0.150"
futures-util = "0.3.32"
tokio-util = "0.7.18"
dotenvy = "0.15"
eframe = "0.32.3"
egui_extras = { version = "0.32.3", features = ["image", "file"] }
egui-phosphor = { version = "0.10.0", default-features = false, features = ["fill"] }
rfd = "0.17.2"

[dev-dependencies]
egui_kittest = { version = "0.32.3", features = ["wgpu", "snapshot", "eframe"] }
